user root;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/javascript   js mjs;
        application/wasm         wasm;
        font/woff2               woff2;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream phyok_k3s_ingress {
        server 127.0.0.1:30080;
        keepalive 64;
    }

    upstream chat_time_legacy_api {
        server 127.0.0.1:43002;
        keepalive 64;
    }

    upstream openclaw_web {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 443 ssl http2;
        server_name www.phyok.com;

        ssl_certificate     /home/cert/phyok.com.crt;
        ssl_certificate_key /home/cert/phyok.com.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 100m;

        location = /ios-support {
            proxy_pass http://chat_time_legacy_api/ios-support;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /android-download {
            proxy_pass http://chat_time_legacy_api/android-download;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /privacy-policy {
            return 301 https://www.phyok.com/app/legal/privacy-policy;
        }

        location /apk/ {
            alias /home/apk/;
            types {
                application/vnd.android.package-archive apk;
            }
            default_type application/octet-stream;
            add_header Content-Disposition "attachment";
            try_files $uri =404;
        }

        location ^~ /agent527/ {
            proxy_pass http://127.0.0.1:5270/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /agent527 {
            return 301 /agent527/;
        }

        location ^~ /agent529/ {
            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /agent529 {
            return 301 /agent529/;
        }

        location ^~ /research/v3/ {
            proxy_pass http://127.0.0.1:5999/research/v3/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /research/v3 {
            return 301 /research/v3/;
        }

        location = /app {
            return 301 /app/;
        }

        location ^~ /app/ {
            proxy_pass http://chat_time_legacy_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /v2/ {
            proxy_pass http://phyok_k3s_ingress;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location ^~ /api/ {
            proxy_pass http://openclaw_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location = /openclaw {
            return 301 /openclaw/;
        }

        location ^~ /openclaw/ {
            proxy_pass http://openclaw_web/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /openclaw;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location / {
            proxy_pass http://phyok_k3s_ingress;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }

    server {
        listen 80;
        server_name global.phyok.com cn.phyok.com tw.phyok.com jp.phyok.com us.phyok.com;
        root /home/web0/;

        location = /flutter_service_worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            expires -1;
            access_log off;
        }

        location ~* \.(wasm|part|mjs|woff2|ttf|otf|png|jpg|jpeg|svg|gif|ico|webp)$ {
            expires 3d;
            add_header Cache-Control "public, max-age=259200, immutable";
            add_header Access-Control-Allow-Origin *;
            try_files $uri =404;
        }

        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Access-Control-Allow-Origin *;
            expires -1;
        }
    }

    server {
        listen 80;
        server_name www.phyok.com phyok.com;
        return 301 https://www.phyok.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name phyok.com;

        ssl_certificate     /home/cert/phyok.com.crt;
        ssl_certificate_key /home/cert/phyok.com.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://www.phyok.com$request_uri;
    }
}
