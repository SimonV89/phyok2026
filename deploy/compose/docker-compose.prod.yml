x-java-db-env: &java_db_env
  SPRING_PROFILES_ACTIVE: docker
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-phyok}
  POSTGRES_USER: ${POSTGRES_USER:-phyok}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_pg}

services:
  chat-web:
    build:
      context: ../../phyok-web/apps/chat-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:3002}
    container_name: phyok-chat-web
    restart: unless-stopped
    depends_on:
      node2-runtime:
        condition: service_started
    environment:
      PORT: ${CHAT_WEB_PORT:-3001}
    ports:
      - "${CHAT_WEB_PORT:-3001}:3001"

  node2-runtime:
    build:
      context: ../../phyok-node2
      dockerfile: Dockerfile
    container_name: phyok-node2-runtime
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      audit-service:
        condition: service_started
    environment:
      PORT: ${NODE2_PORT:-3002}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://127.0.0.1:3001}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:3002}
      DOMAIN_CLIENT_MODE: ${DOMAIN_CLIENT_MODE:-http}
      JAVA_DOMAIN_BASE_URL: ${JAVA_DOMAIN_BASE_URL:-http://memory-service:18083}
      JAVA_AUTH_BASE_URL: ${JAVA_AUTH_BASE_URL:-http://auth-service:18081}
      JAVA_BILLING_BASE_URL: ${JAVA_BILLING_BASE_URL:-http://billing-service:18085}
      JAVA_AUDIT_BASE_URL: ${JAVA_AUDIT_BASE_URL:-http://audit-service:18087}
    ports:
      - "${NODE2_PORT:-3002}:3002"

  postgres:
    image: postgres:16
    container_name: phyok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phyok}
      POSTGRES_USER: ${POSTGRES_USER:-phyok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_pg}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phyok} -d ${POSTGRES_DB:-phyok}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: phyok-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD:-change_me_redis}"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change_me_redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: phyok-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  kafka:
    image: apache/kafka:3.7.0
    container_name: phyok-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-abcdefghijklmnopqrstuv}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "19092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  auth-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:auth-service:bootJar"
        APP_DIR: "apps/auth-service"
    container_name: phyok-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *java_db_env
      AUTH_EMAIL_CODE_TTL_SECONDS: ${AUTH_EMAIL_CODE_TTL_SECONDS:-600}
      AUTH_EMAIL_SEND_COOLDOWN_SECONDS: ${AUTH_EMAIL_SEND_COOLDOWN_SECONDS:-60}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      PHYOK_AUTH_DEFAULT_TENANT_ID: ${PHYOK_AUTH_DEFAULT_TENANT_ID:-tenant-demo}
      PHYOK_AUTH_DEFAULT_APP_ID: ${PHYOK_AUTH_DEFAULT_APP_ID:-phyok-chat-web}
      TENCENT_SES_SECRET_ID: ${TENCENT_SES_SECRET_ID:-}
      TENCENT_SES_SECRET_KEY: ${TENCENT_SES_SECRET_KEY:-}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:-}
      TENCENT_SES_TEMPLATE_EN: ${TENCENT_SES_TEMPLATE_EN:-}
      TENCENT_SES_TEMPLATE_ZH: ${TENCENT_SES_TEMPLATE_ZH:-}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-hongkong}
      TENCENT_SES_API_ENDPOINT: ${TENCENT_SES_API_ENDPOINT:-ses.ap-hongkong.tencentcloudapi.com}
    ports:
      - "${AUTH_PORT:-18081}:18081"

  tenant-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:tenant-service:bootJar"
        APP_DIR: "apps/tenant-service"
    container_name: phyok-tenant-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *java_db_env
    ports:
      - "${TENANT_PORT:-18082}:18082"

  memory-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:memory-service:bootJar"
        APP_DIR: "apps/memory-service"
    container_name: phyok-memory-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${MEMORY_PORT:-18083}:18083"

  knowledge-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:knowledge-service:bootJar"
        APP_DIR: "apps/knowledge-service"
    container_name: phyok-knowledge-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${KNOWLEDGE_PORT:-18084}:18084"

  billing-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:billing-service:bootJar"
        APP_DIR: "apps/billing-service"
    container_name: phyok-billing-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${BILLING_PORT:-18085}:18085"

  payment-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:payment-service:bootJar"
        APP_DIR: "apps/payment-service"
    container_name: phyok-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${PAYMENT_PORT:-18086}:18086"

  audit-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:audit-service:bootJar"
        APP_DIR: "apps/audit-service"
    container_name: phyok-audit-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${AUDIT_PORT:-18087}:18087"

  privacy-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:privacy-service:bootJar"
        APP_DIR: "apps/privacy-service"
    container_name: phyok-privacy-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment: *java_db_env
    ports:
      - "${PRIVACY_PORT:-18088}:18088"

  ops-admin-service:
    build:
      context: ../../phyok-java
      dockerfile: Dockerfile.service
      args:
        GRADLE_TASK: ":apps:ops-admin-service:bootJar"
        APP_DIR: "apps/ops-admin-service"
    container_name: phyok-ops-admin-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *java_db_env
    ports:
      - "${OPS_ADMIN_PORT:-18089}:18089"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  kafka_data:
